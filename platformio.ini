[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
  jgromes/RadioLib@7.8.1
  rweather/Crypto@0.4.0

; Default to the current MeshCore USA/Canada narrow profile.
; Change these to match the MeshCore network you intend to monitor.
build_flags =
  -D MESHCORE_FREQUENCY_MHZ=910.525
  -D MESHCORE_BANDWIDTH_KHZ=62.5
  -D MESHCORE_SPREADING_FACTOR=7
  -D MESHCORE_CODING_RATE=5
